<!DOCTYPE html>
<html>
<head>
<title>DevOps Chatbot</title>

<style>
body{
font-family: Arial;
background:#f4f4f4;
}

#chatbox{
width:400px;
margin:50px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

#messages{
height:300px;
overflow:auto;
border:1px solid #ddd;
padding:10px;
margin-bottom:10px;
}

input{
width:75%;
padding:10px;
}

button{
padding:10px;
}
</style>

</head>

<body>

<div id="chatbox">

<h3>DevOps Pipeline Chatbot</h3>

<div id="messages"></div>

<input id="msg" placeholder="Enter pipeline name..." />
<button onclick="send()">Send</button>

</div>

<script>

function send(){

let input = document.getElementById("msg").value

let messages = document.getElementById("messages")

messages.innerHTML += "<b>You:</b> " + input + "<br>"

fetch(`/pipeline?name=${input}`)
.then(res => res.json())
.then(data => {

messages.innerHTML += "<b>Bot:</b> " + data.response + "<br>"

})

}

</script>

</body>
</html>
